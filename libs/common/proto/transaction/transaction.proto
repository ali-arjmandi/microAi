syntax = "proto3";

package transaction;

service TransactionService {
  rpc CreateTransaction (CreateTransactionRequest) returns (CreateTransactionResponse);
  rpc GetTransaction (GetTransactionRequest) returns (GetTransactionResponse);
  rpc SearchTransactions (SearchTransactionsRequest) returns (SearchTransactionsResponse);
}

message CreateTransactionRequest {
  string title = 1;
  string description = 2;
  string property_address = 3;
  double price = 4;
  string buyer_id = 5;
  string seller_id = 6;
}

message CreateTransactionResponse {
  string transaction_id = 1;
  string state = 2;
}

message GetTransactionRequest {
  string transaction_id = 1;
}

message GetTransactionResponse {
  string transaction_id = 1;
  string title = 2;
  string description = 3;
  string property_address = 4;
  double price = 5;
  string buyer_id = 6;
  string seller_id = 7;
  string state = 8;
  string ai_status = 9;
  string search_status = 10;
  string moderation_status = 11;
  string summary = 12;
  string improved_description = 13;
  string risk_narrative = 14;
  double risk_score = 15;
  string moderation_reason = 16;
  double moderation_confidence = 17;
  repeated string search_tags = 18;
  string ai_model_version = 19;
  string ai_prompt_version = 20;
}

message SearchTransactionsRequest {
  string query = 1;
}

message SearchTransactionsResponse {
  repeated GetTransactionResponse items = 1;
}
